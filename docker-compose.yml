services:
  darkshed:
    image: ghcr.io/hertn/darkshed:latest   # pulled from GitHub; no build needed
    # build: .                             # uncomment to build from this folder instead
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      # optional: require this token for preset / LUT sync (enter it under Menu > Sync & settings)
      DARKSHED_TOKEN: ""
    volumes:
      - ./data:/data
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Optional: checks GitHub every hour and updates DarkShed by itself. Delete this block to update by hand.
  watchtower:
    image: nickfedor/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"   # only touches containers with the label above
      WATCHTOWER_POLL_INTERVAL: "3600"  # seconds
      WATCHTOWER_CLEANUP: "true"        # remove old images
