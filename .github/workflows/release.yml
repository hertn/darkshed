# Builds the self-contained downloads (Node.js bundled, no install needed) for Mac, Windows and Linux.
# Push a version tag (git tag v1.0.0 && git push origin v1.0.0) to publish them on the GitHub Releases page.
# Run it by hand from the Actions tab to build and test them without publishing.
name: Downloads
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=dev" >> "$GITHUB_OUTPUT"; fi
      - run: npm ci
      - run: npm run build
      - run: |
          for t in mac-arm64 mac-x64 win-x64 linux-x64 linux-arm64; do
            node launcher/build-release.mjs "$t" "${{ steps.v.outputs.version }}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: downloads
          path: release/*
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, file: linux-intel-amd, ext: tar.gz }
          - { os: macos-latest, file: mac-apple-silicon, ext: zip }
          - { os: windows-latest, file: windows, ext: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: downloads
          path: dl
      - name: Unpack
        shell: bash
        run: |
          mkdir run && cd run
          f="../dl/DarkShed-${{ needs.build.outputs.version }}-${{ matrix.file }}.${{ matrix.ext }}"
          if [ "${{ matrix.ext }}" = zip ]; then unzip -q "$f"; else tar -xzf "$f"; fi
          ls DarkShed
      - name: Start it and ask it for the page (Mac / Linux)
        if: runner.os != 'Windows'
        run: |
          cd run/DarkShed
          DARKSHED_PORT=8099 ./runtime/node launcher/start.mjs --no-open > ../out.log 2>&1 &
          sleep 4
          cat ../out.log
          curl -fsS http://localhost:8099/api/ping
          curl -fsS http://localhost:8099/ | grep -qi "<title>"
          curl -fsS -X PUT -H 'content-type: application/json' -d '{}' http://localhost:8099/api/presets
          test -f data/presets.json
      - name: Start it and ask it for the page (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd run/DarkShed
          $env:DARKSHED_PORT = '8099'
          $p = Start-Process -FilePath .\runtime\node.exe -ArgumentList 'launcher\start.mjs','--no-open' -PassThru -RedirectStandardOutput ..\out.log
          Start-Sleep 5
          Get-Content ..\out.log
          (Invoke-WebRequest http://localhost:8099/api/ping -UseBasicParsing).Content
          if ((Invoke-WebRequest http://localhost:8099/ -UseBasicParsing).Content -notmatch '(?i)<title>') { throw 'no page' }
          Stop-Process $p.Id
      - name: Background mode, install then remove (Windows, informational)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          cd run/DarkShed
          '{"port":8098}' | Set-Content data\launcher.json
          $env:DARKSHED_SERVICE_LABEL = 'DarkShedCiTest'
          .\runtime\node.exe launcher\service.mjs install
          Start-Sleep 6
          (Invoke-WebRequest http://localhost:8098/api/ping -UseBasicParsing).Content
          .\runtime\node.exe launcher\service.mjs status
          .\runtime\node.exe launcher\service.mjs remove
          Start-Sleep 2
          .\runtime\node.exe launcher\service.mjs status

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: downloads
          path: dl
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dl/* --title "DarkShed $GITHUB_REF_NAME" --generate-notes
